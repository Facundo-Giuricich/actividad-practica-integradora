services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      # Solo para conectarse desde la máquina host (DBeaver, backend sin Docker).
      # Se usa 5433 por defecto para no chocar con un PostgreSQL local en 5432.
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready devuelve 0 solo cuando Postgres acepta conexiones.
      # $$ escapa el $ para que lo resuelva el shell del contenedor, no Compose.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Dentro de la red de Compose la base siempre se llama "db".
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "${API_PORT}:${API_PORT}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
